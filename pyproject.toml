[project]
name = "recall-scan-api"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.124.4",
  "uvicorn[standard]==0.38.0",
  "sqlalchemy[asyncio]==2.0.45",
  "asyncpg==0.31.0",
  "pydantic==2.12.5",
  "pydantic-settings==2.12.0",
  "httpx==0.28.1",
]

[dependency-groups]
dev = [
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["api/app/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"
